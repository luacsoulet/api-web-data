# Dokploy (service « Compose ») : aucun port publié, Traefik route le domaine vers web:3000.
# Le port 3000 de l'hôte est déjà pris par Dokploy. En local : voir docker-compose.ports.yml.
services:
  api:
    build: ./api
    restart: unless-stopped
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    expose:
      - 3000
    depends_on:
      api:
        condition: service_healthy
